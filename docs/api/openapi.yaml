        name: {type: [string, 'null'], description: 'Eigener Name; null = Übersetzung des Schlüssels'}
        icon: {type: [string, 'null'], enum: [bike, road_bike, mtb, indoor_bike, ebike, run, street_run, trail_run, walk, ski, nordic, skating, swim, pool, studio, strength, unknown, tag, star, mountain, flag, null], description: 'Symbol aus dem festen Satz; null = Vorgabe der Oberfläche nach Klasse und Schlüssel'}
        builtin: {type: boolean}
    SubSport:
      type: object
      required: [sport_class, key, name, icon, builtin, activity_count, mapping_count]
      properties:
        sport_class: {$ref: '#/components/schemas/SportClass'}
        key: {type: string, pattern: '^[a-z0-9_]+$'}
        name: {type: [string, 'null'], maxLength: 40}
        icon: {type: [string, 'null'], enum: [bike, road_bike, mtb, indoor_bike, ebike, run, street_run, trail_run, walk, ski, nordic, skating, swim, pool, studio, strength, unknown, tag, star, mountain, flag, null], description: 'Symbol aus dem festen Satz; null = Vorgabe der Oberfläche nach Klasse und Schlüssel'}
        builtin: {type: boolean}
        activity_count: {type: integer, minimum: 0, description: 'Aktivitäten derselben Sportklasse mit diesem Untertyp'}
        mapping_count: {type: integer, minimum: 0}
    SubSportCreate:
      type: object
      additionalProperties: false
      required: [sport_class, name]
      properties:
        sport_class: {type: string, enum: [cycling, ebike, running, skiing, swimming, studio]}
        name: {type: string, minLength: 1, maxLength: 40, description: 'Ohne Leerzeichen am Rand; ohne Groß-/Kleinschreibung eindeutig je Klasse'}
        icon: {type: [string, 'null'], enum: [bike, road_bike, mtb, indoor_bike, ebike, run, street_run, trail_run, walk, ski, nordic, skating, swim, pool, studio, strength, unknown, tag, star, mountain, flag, null], description: 'Symbol aus dem festen Satz; null = Vorgabe der Oberfläche nach Klasse und Schlüssel'}
    SubSportRename:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: [string, 'null'], minLength: 1, maxLength: 40}
        icon: {type: [string, 'null'], enum: [bike, road_bike, mtb, indoor_bike, ebike, run, street_run, trail_run, walk, ski, nordic, skating, swim, pool, studio, strength, unknown, tag, star, mountain, flag, null], description: 'Symbol aus dem festen Satz; null = Vorgabe der Oberfläche nach Klasse und Schlüssel'}
    SubSportResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/SubSport'}
    SubSportListResponse:
      type: object
      required: [data, meta]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/SubSport'}}
        meta: {type: object, required: [total], properties: {total: {type: integer}}}
    SeasonUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        start_date: {type: string, format: date}
        end_date: {type: string, format: date}
    SeasonResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/Season'}
    SeasonListResponse:
      type: object
      required: [data, meta]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Season'}}
        meta:
          type: object
          required: [total, default_season_id, today]
          properties:
            total: {type: integer, minimum: 0}
            default_season_id: {oneOf: [{type: string, format: uuid}, {type: 'null'}]}
            today: {type: string, format: date, description: 'Heutiger lokaler Tag in der Zeitzone der TOML'}
    StatisticsSummary:
      type: object
      required: [sport_class, count, distance_m, total_time_ms, elevation_gain_m, activities_without_distance, activities_without_elevation, segment_success_count]
      properties:
        sport_class: {type: string, enum: [cycling, ebike, running, skiing, swimming, studio, all]}
        count: {type: integer, minimum: 0}
        distance_m: {type: number, minimum: 0}
        total_time_ms: {type: integer, minimum: 0}
        elevation_gain_m: {type: number, minimum: 0}
        activities_without_distance: {type: integer, minimum: 0}
        activities_without_elevation: {type: integer, minimum: 0}
        segment_success_count: {type: integer, minimum: 0, description: 'Erste Bestzeiten und PR-Verbesserungen der Aktivitäten (RFC-0009)'}
    StatisticsResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [from, to, first_day, last_day, summaries, by_month, by_week, records]
          properties:
            from: {type: [string, 'null'], format: date}
            to: {type: [string, 'null'], format: date}
            first_day: {type: [string, 'null'], format: date, description: 'Erster lokaler Tag mit Aktivität in der Auswahl'}
            last_day: {type: [string, 'null'], format: date}
            summaries: {type: array, items: {$ref: '#/components/schemas/StatisticsSummary'}}
            by_month:
              type: array
              description: Ein Eintrag je Monat und Sportklasse mit Aktivität
              items:
                type: object
                required: [month, sport_class, count, distance_m, total_time_ms, elevation_gain_m]
                properties:
                  month: {type: string, pattern: '^[0-9]{4}-[0-9]{2}$'}
                  sport_class: {$ref: '#/components/schemas/SportClass'}
                  count: {type: integer, minimum: 1}
                  distance_m: {type: number}
                  total_time_ms: {type: integer}
                  elevation_gain_m: {type: number}
            by_week:
              type: array
              description: Ein Eintrag je ISO-Woche und Sportklasse mit Aktivität
              items:
                type: object
                required: [week, week_start, sport_class, count, distance_m, total_time_ms]
                properties:
                  week: {type: string, pattern: '^[0-9]{4}-W[0-9]{2}$'}
                  week_start: {type: string, format: date, description: 'Montag der Woche'}
                  sport_class: {$ref: '#/components/schemas/SportClass'}
                  count: {type: integer, minimum: 1}
                  distance_m: {type: number}
                  total_time_ms: {type: integer}
            records: {type: array, items: {$ref: '#/components/schemas/RecordItem'}, description: 'Eine Kategorie fehlt, wenn keine Aktivität der Sportklasse in der Auswahl einen Wert hat'}
        meta:
          type: object
          required: [calculation]
          properties:
            calculation: {$ref: '#/components/schemas/Calculation'}
    RecordItem:
      type: object
      required: [sport_class, kind, value, equaled_count, activity]
      properties:
        sport_class: {$ref: '#/components/schemas/RankedSportClass'}
        kind: {type: string, enum: [distance, elevation, time, speed]}
        value: {type: number, description: 'Ungerundet in m, m, ms bzw. km/h. Verglichen wird gerundet wie angezeigt (10 m, 1 m, 1 s, 0,1 km/h, beim Laufen Pace 1 s/km)'}
        equaled_count: {type: integer, minimum: 0, description: 'Spätere Aktivitäten mit gleichem gerundeten Wert (Einstellung)'}
        activity:
          type: object
          required: [id, title, start_time, sub_sport]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            title: {type: string}
            start_time: {$ref: '#/components/schemas/Timestamp'}
            sub_sport: {type: [string, 'null']}
    PeriodShortSummary:
      type: object
      required: [count, distance_m, total_time_ms]
      properties:
        count: {type: integer, minimum: 0}
        distance_m: {type: number, minimum: 0}
        total_time_ms: {type: integer, minimum: 0}
    StatisticsPeriodsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [seasons, years]
          properties:
            seasons:
              type: array
              items:
                allOf:
                  - {$ref: '#/components/schemas/PeriodShortSummary'}
                  - {type: object, required: [season_id], properties: {season_id: {$ref: '#/components/schemas/Uuid'}}}
            years:
              type: array
              items:
                allOf:
                  - {$ref: '#/components/schemas/PeriodShortSummary'}
                  - {type: object, required: [year], properties: {year: {type: integer}}}
    TargetState: {type: string, enum: [available, unavailable, not_writable]}
    BackupOutcome: {type: string, enum: [created, skipped_no_changes, skipped_target_unavailable, failed]}
    BackupStatus:
      type: object
      required: [last_attempt, last_success, pending_changes, running_operation_id, target]
      properties:
        last_attempt:
          oneOf:
            - type: 'null'
            - type: object
              required: [time, outcome, reason]
              properties:
                time: {$ref: '#/components/schemas/Timestamp'}
                outcome: {$ref: '#/components/schemas/BackupOutcome'}
                reason: {type: [string, 'null']}
        last_success:
          oneOf:
            - type: 'null'
            - type: object
              required: [time, revision_id]
              properties:
                time: {$ref: '#/components/schemas/Timestamp'}
                revision_id: {type: string}
        pending_changes: {type: boolean, description: 'Sicherungsrelevante Änderungen seit der letzten erfolgreichen Sicherung'}
        running_operation_id: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]}
        target:
          type: object
          required: [state, free_bytes]
          properties:
            state: {$ref: '#/components/schemas/TargetState'}
            free_bytes: {type: [integer, 'null'], minimum: 0}
    BackupStatusResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/BackupStatus'}
    BackupEntry:
      type: object
      required: [id, kind, created_at, revision_id, format_version, size_bytes, check_status, activity_count, segment_count]
      properties:
        id: {type: string, description: 'Undurchsichtige Referenz auf den Stand im Sicherungsziel (kein Dateipfad)'}
        kind: {type: string, enum: [regular, pre_migration]}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        revision_id: {type: string}
        format_version: {type: integer, minimum: 1}
        size_bytes: {type: integer, minimum: 0}
        check_status: {type: string, enum: [ok, failed, unchecked]}
        activity_count: {type: integer, minimum: 0}
        segment_count: {type: integer, minimum: 0}
    BackupListResponse:
      type: object
      required: [data, meta]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/BackupEntry'}}
        meta:
          type: object
          required: [target]
          properties:
            target:
              type: object
              required: [state]
              properties:
                state: {$ref: '#/components/schemas/TargetState'}
    Operation:
      type: object
      required: [id, kind, status, phase, outcome, error, started_at, finished_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        kind: {type: string, enum: [backup, restore]}
        status: {type: string, enum: [queued, running, done, failed, rolled_back]}
        phase: {type: [string, 'null'], description: 'Aktuelle Phase, zum Beispiel `checking`, `staging`, `copying`, `switching`, `verifying`'}
        outcome: {type: [string, 'null'], enum: [created, skipped_no_changes, skipped_target_unavailable, restored, failed, null]}
        error:
          oneOf:
            - type: 'null'
            - type: object
              required: [code, message]
              properties:
                code: {type: string}
                message: {type: string}
        started_at: {$ref: '#/components/schemas/Timestamp'}
        finished_at: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
    OperationResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/Operation'}
    RestorePreviewRequest:
      type: object
      required: [backup_id]
      additionalProperties: false
      properties:
        backup_id: {type: string}
    RestorePreviewResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [preview_token, backup, current, comparison, requires_acknowledgement, warnings]
          properties:
            preview_token: {type: string}
            backup: {$ref: '#/components/schemas/BackupEntry'}
            current:
              type: object
              required: [revision_id, activity_count, segment_count, is_empty]
              properties:
                revision_id: {type: [string, 'null']}
                activity_count: {type: integer, minimum: 0}
                segment_count: {type: integer, minimum: 0}
                is_empty: {type: boolean}
            comparison: {type: string, enum: [older, same, newer, not_comparable], description: 'Stand der Sicherung gegenüber dem aktuellen Stand, nur bekannte Vorgängerbeziehungen zählen'}
            requires_acknowledgement: {type: boolean, description: 'Bei `older` und `not_comparable` ist eine ausdrückliche Zustimmung nötig'}
            warnings: {type: array, items: {$ref: '#/components/schemas/Notice'}}
    RestoreRequest:
      type: object
      required: [preview_token]
      additionalProperties: false
      properties:
        preview_token: {type: string}
        acknowledge_warnings: {type: boolean, default: false}
    JobKind: {type: string, enum: [segment_history, activity_evaluation, recalculation]}
    JobStatus: {type: string, enum: [queued, running, done, failed]}
    Job:
      type: object
      required: [id, kind, status, segment_id, activity_id, processed_items, total_items, error_message, created_at, started_at, finished_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        kind: {$ref: '#/components/schemas/JobKind'}
        status: {$ref: '#/components/schemas/JobStatus'}
        segment_id: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]}
        activity_id: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]}
        processed_items: {type: integer, minimum: 0}
        total_items: {type: integer, minimum: 0}
        error_message: {type: [string, 'null']}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        started_at: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        finished_at: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
    JobResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/Job'}
    JobListResponse:
      type: object
      required: [data, meta]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Job'}}
        meta: {$ref: '#/components/schemas/ListMeta'}
    HealthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status, checks]
          properties:
            status: {type: string, enum: [ok, degraded, fail], description: '`fail` wird mit 503 geliefert'}
            checks:
              type: array
              items:
                type: object
                required: [name, status, message]
                properties:
                  name: {type: string, enum: [backend, database, filesystem, storage]}
                  status: {type: string, enum: [ok, warn, fail]}
                  message: {type: [string, 'null']}
    ReadyResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [ready]
          properties:
            ready: {type: boolean, const: true}
    VersionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [app_version, api_version, schema_version, algorithm_version]
          properties:
            app_version: {type: string}
            api_version: {type: string, const: v1}
            schema_version: {type: integer, minimum: 1}
            algorithm_version: {type: integer, minimum: 1, description: 'Version des Matching- und Statistikalgorithmus'}
    SystemResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [uptime_s, started_at, platform, tzdata_version, tls_certificate_expires_at, counts, storage, calculation, jobs, warnings]
          properties:
            uptime_s: {type: integer, minimum: 0}
            started_at: {$ref: '#/components/schemas/Timestamp'}
            platform: {type: string, enum: [windows_service, windows_console, container], description: 'Betriebsart nach RFC-0005'}
            tzdata_version: {type: string, description: 'Version der im Programm enthaltenen IANA-Zeitzonendaten, z. B. `2026a`'}
            tls_certificate_expires_at:
              description: 'Ablauf des Zertifikats aus `[tls]`; null, wenn das Backend kein TLS terminiert (Docker)'
              oneOf:
                - {$ref: '#/components/schemas/Timestamp'}
                - {type: 'null'}
            counts:
              type: object
              required: [activities, segments, efforts]
              properties:
                activities: {type: integer, minimum: 0}
                segments: {type: integer, minimum: 0}
                efforts: {type: integer, minimum: 0}
            storage:
              type: object
              required: [data_free_bytes, backup_target_free_bytes]
              properties:
                data_free_bytes: {type: integer, minimum: 0}
                backup_target_free_bytes: {type: [integer, 'null'], minimum: 0}
            calculation: {$ref: '#/components/schemas/Calculation'}
            jobs:
              type: object
              required: [queued, running, failed]
              properties:
                queued: {type: integer, minimum: 0}
                running: {type: integer, minimum: 0}
                failed: {type: integer, minimum: 0}
            warnings:
              type: array
              items:
                type: object
                required: [code, message, since]
                properties:
                  code: {type: string, description: 'Zum Beispiel `low_disk_space`, `backup_pending`, `backup_failed`, `job_failed`, `calculation_stale`, `certificate_expiring` (30 Tage vor Ablauf, RFC-0013)'}
                  message: {type: string}
                  since: {$ref: '#/components/schemas/Timestamp'}
    ConfigResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [timezone, user, map, import_limits, segments, sub_sport_catalog]
          properties:
            timezone: {type: string, description: 'IANA-Zeitzone für Anzeige, Kalender und lokale Eingaben'}
            user:
              type: object
              required: [display_name]
              properties:
                display_name: {type: string, description: 'Spitzname aus der Datenbank'}
            map:
              type: object
              required: [tile_url, attribution, track_max_points]
              properties:
                tile_url: {type: string}
                attribution: {type: string}
                track_max_points: {type: integer, minimum: 2, maximum: 100000, description: 'max_points, mit dem die Detailseite Karte und Diagramm lädt (C2)'}
            import_limits:
              type: object
              required: [max_file_size_mb, max_points_per_session]
              properties:
                max_file_size_mb: {type: integer, minimum: 1}
                max_points_per_session: {type: integer, minimum: 1}
            segments:
              type: object
              required: [minimum_length_m, route_edge_m]
              properties:
                minimum_length_m: {type: number, exclusiveMinimum: 0}
                route_edge_m: {type: number, exclusiveMinimum: 0, description: 'Strecke: größter Abstand von Start und Ziel zum Rand des Abschnitts'}
            sub_sport_catalog:
              type: object
              description: Untertypen je Sportklasse für Auswahl, Filter und Anzeige, aus der Datenbank
              additionalProperties:
                type: array
                items: {$ref: '#/components/schemas/SubSportCatalogEntry'}
