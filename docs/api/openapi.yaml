        category: {oneOf: [{$ref: '#/components/schemas/SegmentCategory'}, {type: 'null'}], description: 'Von Hand; muss zur Art passen, ohne Angabe automatisch'}
      examples:
        - {activity_id: 0198c1f2-6b3a-7c1e-9d44-2f6a1b8e5a10, section_index: 0, start_index: 4310, end_index: 9800, name: Puerta de la Cabra, sport_class: cycling}
    SimilarRoutesQuery:
      type: object
      required: [activity_id, section_index, start_index, end_index, sport_class]
      additionalProperties: false
      properties:
        activity_id: {$ref: '#/components/schemas/Uuid'}
        section_index: {type: integer, minimum: 0}
        start_index: {type: integer, minimum: 0}
        end_index: {type: integer, minimum: 1}
        sport_class: {$ref: '#/components/schemas/RankedSportClass'}
    SimilarRoutesResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            type: object
            required: [id, name, length_m, overlap]
            properties:
              id: {$ref: '#/components/schemas/Uuid'}
              name: {type: string}
              length_m: {type: number}
              overlap: {type: number, minimum: 0, maximum: 1}
        meta: {type: object}
    SegmentUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1}
        description: {type: [string, 'null']}
        kind: {$ref: '#/components/schemas/SegmentKind', description: 'Artwechsel bestimmt die Kategorie neu und verwirft eine Wahl von Hand'}
        location: {type: [string, 'null']}
        category: {oneOf: [{$ref: '#/components/schemas/SegmentCategory'}, {type: 'null'}], description: 'null: zurück zur automatischen Kategorie'}
    SegmentCategory:
      type: string
      enum: [climb, descent, rolling, loop, out_and_back, point_to_point]
      description: 'Segment: climb (Ø ≥ +2 %), descent (Ø ≤ −2 %), rolling; Strecke: loop (Start und Ziel ≤ 200 m), out_and_back (dazu Rückweg zu 70 % auf dem Hinweg), point_to_point („Strecke“)'
    SegmentKind: {type: string, enum: [segment, route], description: 'route = Strecke über eine ganze Tour (RFC-0016), nur Anzeige und Filter'}
    PeriodSummary:
      type: object
      description: Summen enthalten nur vorhandene Werte. Die Zähler nennen, wie viele Aktivitäten ohne Distanz bzw. Aufstieg eingegangen sind.
      required: [period, sport_class, count, distance_m, total_time_ms, elevation_gain_m, activities_without_distance, activities_without_elevation]
      properties:
        period: {type: string, description: 'ISO-Woche `2026-W44`, Monat `2026-10`, Jahr `2026` oder `all`'}
        sport_class: {type: string, enum: [cycling, ebike, running, skiing, swimming, studio, unknown, all]}
        count: {type: integer, minimum: 0}
        distance_m: {type: number, minimum: 0}
        total_time_ms: {type: integer, minimum: 0}
        elevation_gain_m: {type: number, minimum: 0}
        activities_without_distance: {type: integer, minimum: 0}
        activities_without_elevation: {type: integer, minimum: 0}
    DayBucket:
      type: object
      description: Ein Eintrag je Kalendertag und Sportklasse mit mindestens einer Aktivität (gestapelte Balken, RFC-0018). Tage ohne Aktivität fehlen.
      required: [date, sport_class, count, distance_m, total_time_ms]
      properties:
        date: {type: string, format: date, description: 'Lokaler Kalendertag'}
        sport_class: {$ref: '#/components/schemas/SportClass'}
        count: {type: integer, minimum: 0}
        distance_m: {type: number, minimum: 0}
        total_time_ms: {type: integer, minimum: 0}
    PeriodBlock:
      type: object
      required: [period, from, to, summaries, by_day]
      properties:
        period: {type: string}
        from: {type: string, format: date}
        to: {type: string, format: date}
        summaries: {type: array, items: {$ref: '#/components/schemas/PeriodSummary'}}
        by_day: {type: array, items: {$ref: '#/components/schemas/DayBucket'}}
    DashboardStatsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [week, month, year]
          properties:
            week: {$ref: '#/components/schemas/PeriodBlock'}
            month: {$ref: '#/components/schemas/PeriodBlock'}
            year:
              allOf:
                - {$ref: '#/components/schemas/PeriodBlock'}
              description: 'Laufendes Kalenderjahr (1.1. bis 31.12.); `period` ist die Jahreszahl.'
    LoadMethod:
      type: string
      enum: [samples, average, estimated]
      description: 'samples: HF je Messpunkt; average: Durchschnitts-HF × Dauer; estimated: ohne HF oder ohne Zonensatz, Dauer × Faktor der Sportklasse'
    ZoneModel:
      type: string
      enum: [max, reserve, threshold]
      description: '% der max. HF, % der HF-Reserve (Karvonen), % der Schwellen-HF (Friel)'
    HrZoneSet:
      type: object
      required: [id, sport_class, valid_from, max_hr, resting_hr, threshold_hr, model, bounds, zones_bpm, anaerobic_from_bpm]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        sport_class: {oneOf: [{$ref: '#/components/schemas/SportClass'}, {type: 'null'}], description: 'null = allgemeiner Satz'}
        valid_from: {type: string, format: date, description: 'Gilt ab diesem lokalen Tag; der älteste allgemeine Satz gilt auch davor'}
        max_hr: {type: integer, minimum: 100, maximum: 240}
        resting_hr: {type: integer, minimum: 25, maximum: 120}
        threshold_hr: {type: [integer, 'null']}
        model: {$ref: '#/components/schemas/ZoneModel'}
        bounds: {type: array, items: {type: integer, minimum: 30, maximum: 120}, minItems: 5, maxItems: 5, description: 'Untere Grenzen der Zonen 1–5 in Prozent, aufsteigend'}
        zones_bpm:
          type: array
          minItems: 5
          maxItems: 5
          items: {type: array, items: {type: [integer, 'null']}, minItems: 2, maxItems: 2}
          description: 'Je Zone [von, bis] in Schlägen pro Minute; die letzte ist nach oben offen'
        anaerobic_from_bpm: {type: integer, description: 'Schwellen-HF, sonst Beginn von Zone 4'}
    HrZoneSetInput:
      type: object
      additionalProperties: false
      properties:
        sport_class: {oneOf: [{$ref: '#/components/schemas/SportClass'}, {type: 'null'}]}
        valid_from: {type: string, format: date}
        max_hr: {type: integer}
        resting_hr: {type: integer}
        threshold_hr: {type: [integer, 'null']}
        model: {$ref: '#/components/schemas/ZoneModel'}
        bounds: {type: array, items: {type: integer}, minItems: 5, maxItems: 5}
    HrZoneSetResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/HrZoneSet'}
    HrZoneSetListResponse:
      type: object
      required: [data, meta]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/HrZoneSet'}}
        meta:
          type: object
          required: [suggestion]
          properties:
            suggestion:
              type: object
              required: [age, max_hr]
              properties:
                age: {type: [integer, 'null']}
                max_hr: {type: [integer, 'null']}
    ActivityLoad:
      type: object
      required: [trimp, aerobic, anaerobic, method, zone_seconds, zone_set]
      properties:
        trimp: {type: number, minimum: 0, description: 'Banister-TRIMP: Σ Minuten × x × 0,64 × e^(Faktor × x), x = Anteil der HF-Reserve; Pausen über 60 s zählen nicht'}
        aerobic: {type: number, minimum: 0, description: 'Anteil unter `anaerobic_from_bpm`'}
        anaerobic: {type: number, minimum: 0}
        method: {$ref: '#/components/schemas/LoadMethod'}
        zone_seconds: {type: [array, 'null'], items: {type: integer}, description: 'Sekunden in Zone 1–5 (unter Zone 2 zählt zu Zone 1); nur bei `samples`'}
        zone_set: {oneOf: [{$ref: '#/components/schemas/HrZoneSet'}, {type: 'null'}]}
    LoadSettings:
      type: object
      required: [sex_factor, fitness_days, fatigue_days, estimate_per_hour, curve_model, aerobic_days, anaerobic_days, rest_bonus_pct, foster_surcharge, foster_surcharge_pct, fatigue_weight]
      properties:
        sex_factor: {type: number, enum: [1.92, 1.67], description: 'Gewichtung der Banister-Formel (männlich / weiblich)'}
        fitness_days: {type: integer, minimum: 7, maximum: 120, default: 42}
        fatigue_days: {type: integer, minimum: 2, maximum: 30, default: 7, description: 'Kürzer als fitness_days'}
        estimate_per_hour: {type: object, additionalProperties: {type: number, minimum: 0, maximum: 300}, description: 'Belastung je Stunde ohne HF, je Sportklasse'}
        curve_model: {type: string, enum: [standard, two_curve], default: standard, description: 'two_curve: Ermüdung getrennt aerob/anaerob mit Ruhetags-Bonus (RFC-0009)'}
        aerobic_days: {type: integer, minimum: 2, maximum: 30, default: 5}
        anaerobic_days: {type: integer, minimum: 2, maximum: 30, default: 12}
        rest_bonus_pct: {type: integer, minimum: 0, maximum: 50, default: 18}
        foster_surcharge: {type: boolean, default: false, description: 'Aufschlag auf die Ermüdung bei Monotonie über 2,0'}
        foster_surcharge_pct: {type: integer, minimum: 1, maximum: 50, default: 15}
        fatigue_weight: {type: number, minimum: 0.25, maximum: 3, default: 1, description: 'Form = Fitness − Gewicht × Ermüdung (#24); auf zwei Nachkommastellen gerundet'}
    LoadSettingsUpdate:
      type: object
      additionalProperties: false
      properties:
        sex_factor: {type: number, enum: [1.92, 1.67]}
        fitness_days: {type: integer}
        fatigue_days: {type: integer}
        estimate_per_hour: {type: object, additionalProperties: {type: number}}
        curve_model: {type: string, enum: [standard, two_curve]}
        aerobic_days: {type: integer}
        anaerobic_days: {type: integer}
        rest_bonus_pct: {type: integer}
        foster_surcharge: {type: boolean}
        foster_surcharge_pct: {type: integer}
        fatigue_weight: {type: number}
    FormSnapshot:
      type: object
      required: [date, fitness, fatigue, form, monotony, strain]
      properties:
        date: {type: string, format: date}
        fitness: {type: number}
        fatigue: {type: number}
        form: {type: number}
        monotony: {type: [number, 'null']}
        strain: {type: [number, 'null']}
    LoadSettingsResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/LoadSettings'}
    FormDay:
      type: object
      required: [date, load, fitness, fatigue, form]
      properties:
        date: {type: string, format: date}
        load: {type: number}
        aerobic: {type: number, description: 'Nur in `days`'}
        anaerobic: {type: number, description: 'Nur in `days`'}
        estimated: {type: number, description: 'Nur in `days`; geschätzter Anteil, nicht in aerob/anaerob enthalten'}
        fitness: {type: number, description: 'Nach dem Training des Tages'}
        fatigue: {type: number, description: 'Nach dem Training des Tages'}
        form: {type: number, description: 'Zu Beginn des Tages: Fitness − Ermüdung des Vortags'}
        fatigue_aerobic: {type: [number, 'null'], description: 'Nur im Zwei-Kurven-Modell'}
        fatigue_anaerobic: {type: [number, 'null'], description: 'Nur im Zwei-Kurven-Modell'}
        monotony: {type: [number, 'null'], description: 'Foster, letzte 7 Tage'}
        strain: {type: [number, 'null'], description: 'Wochensumme × Monotonie'}
    FormResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [today, from, to, settings, zones_configured, pending, first_date, current, days, forecast]
          properties:
            today: {type: string, format: date}
            from: {type: string, format: date}
            to: {type: string, format: date}
            settings: {$ref: '#/components/schemas/LoadSettings'}
            zones_configured: {type: boolean}
            pending: {type: integer, minimum: 0, description: 'Aktivitäten, deren Belastung noch (neu) berechnet wird'}
            first_date: {type: [string, 'null'], format: date}
            monotony_warn: {type: number, description: 'Ab dieser Monotonie warnt die Seite (2,0)'}
            current:
              type: object
              required: [fitness, fatigue, form, load_7d, load_prev_7d, fitness_week_ago, fatigue_week_ago]
              properties:
                fitness: {type: number}
                fatigue: {type: number}
                form: {type: number}
                load_7d: {type: number}
                load_prev_7d: {type: number}
                fitness_week_ago: {type: number}
                fatigue_week_ago: {type: number}
                fatigue_aerobic: {type: [number, 'null']}
                fatigue_anaerobic: {type: [number, 'null']}
                monotony: {type: [number, 'null']}
                strain: {type: [number, 'null']}
                strain_week_ago: {type: [number, 'null']}
                compare:
                  type: object
                  description: 'Kachelreihen der Formseite (#25): Stand vor 30 und 7 Tagen sowie in 7 Tagen mit der gewählten Vorschau'
                  required: [month_ago, week_ago, week_ahead]
                  properties:
                    month_ago: {$ref: '#/components/schemas/FormSnapshot'}
                    week_ago: {$ref: '#/components/schemas/FormSnapshot'}
                    week_ahead: {oneOf: [{$ref: '#/components/schemas/FormSnapshot'}, {type: 'null'}]}
            days: {type: array, items: {$ref: '#/components/schemas/FormDay'}}
            forecast:
              type: object
              required: [mode, daily_load, days]
              properties:
                mode: {type: string, enum: [rest, steady, plan]}
                daily_load: {type: number}
                days: {type: array, items: {$ref: '#/components/schemas/FormDay'}}
            plan:
              type: object
              description: 'Trainingsplan (E8): alle Ziele und der letzte Tag mit offener Einheit ab morgen'
              properties:
                goals: {type: array, items: {$ref: '#/components/schemas/PlanGoal'}}
                last_date: {type: [string, 'null'], format: date}
    AvatarColor:
      type: string
      enum: [blue, teal, green, amber, orange, red, pink, violet]
      description: Farbe des Benutzersymbols; ein eigenes Bild folgt später
    Profile:
      type: object
      required: [id, nickname, first_name, last_name, birthday, avatar_color, updated_at]
      properties:
        id: {type: string, format: uuid}
        nickname: {type: string, minLength: 1, maxLength: 40, description: 'Spitzname, überall angezeigt; im Symbol ganz bis 3 Zeichen, sonst das erste Zeichen'}
        first_name: {type: [string, 'null'], maxLength: 60}
        last_name: {type: [string, 'null'], maxLength: 60}
        birthday: {type: [string, 'null'], format: date, description: 'Freiwillig; Zweck: Alter für spätere HF-Zonen und Auswertungen (B13)'}
        avatar_color: {oneOf: [{$ref: '#/components/schemas/AvatarColor'}, {type: 'null'}]}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    ProfileResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/Profile'}
    ProfileUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nickname: {type: string, minLength: 1, maxLength: 40, description: 'Leerraum am Rand wird entfernt; leer oder null wird abgewiesen'}
        first_name: {type: [string, 'null'], maxLength: 60}
        last_name: {type: [string, 'null'], maxLength: 60}
        birthday: {type: [string, 'null'], format: date, description: 'Zwischen 1900-01-01 und heute'}
        avatar_color: {oneOf: [{$ref: '#/components/schemas/AvatarColor'}, {type: 'null'}]}
    Season:
      type: object
      required: [id, name, start_date, end_date, state, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 80}
        start_date: {type: string, format: date, description: 'Erster lokaler Kalendertag'}
        end_date: {type: string, format: date, description: 'Letzter lokaler Kalendertag, einschließlich'}
        state: {type: string, enum: [current, ended, upcoming], description: 'Lage zum heutigen lokalen Tag'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    SeasonCreate:
      type: object
      additionalProperties: false
      required: [name, start_date, end_date]
      properties:
        name: {type: string, minLength: 1, maxLength: 80, description: 'Leerraum am Rand wird entfernt; eindeutig ohne Rücksicht auf Groß- und Kleinschreibung'}
        start_date: {type: string, format: date}
        end_date: {type: string, format: date}
    GarminActivityStatus:
      type: string
      enum: [imported, linked, locked, rejected, failed]
      description: |
        imported: neu angelegt; linked: gleiche Datei oder Duplikatkandidat vorhanden, nur verknüpft; locked: Session
        gesperrt (Fahrzeug, Punktgrenze, ohne Startzeit); rejected: Datei unlesbar oder bei Garmin gelöscht;
        failed: Abruf gescheitert, der nächste Lauf versucht es erneut (höchstens 5 Versuche).
    GarminProgress:
      type: object
      required: [phase, total, processed, imported, linked, locked, rejected, failed]
      properties:
        phase: {type: string, enum: ['', token, list, download, import, idle], description: 'Leer vor dem ersten Lauf seit dem Start'}
        total: {type: integer, minimum: 0, description: 'Zu bearbeitende Aktivitäten des Laufs; 0, solange die Liste gelesen wird'}
        processed: {type: integer, minimum: 0}
        imported: {type: integer, minimum: 0}
        linked: {type: integer, minimum: 0}
        locked: {type: integer, minimum: 0}
        rejected: {type: integer, minimum: 0}
        failed: {type: integer, minimum: 0}
    GarminStatus:
      type: object
      required: [configured, key_set_at, enabled, start_date, interval_minutes, backfill_done, running, progress,
                 last_run_started_at, last_run_finished_at, last_success_at, last_error, counts]
      properties:
        configured: {type: boolean, description: 'Schlüssel gesetzt'}
        key_set_at: {type: [string, 'null'], format: date-time}
        enabled: {type: boolean, description: 'Regelmäßiger Abruf eingeschaltet'}
        start_date: {type: [string, 'null'], format: date, description: 'Frühester Starttag (Konfigurationszone), null = gesamte Historie'}
        interval_minutes: {type: integer, minimum: 5, maximum: 1440}
        backfill_done: {type: boolean, description: 'Gesamtimport bis Listenende bzw. Anfangsdatum durchgelaufen'}
        running: {type: boolean}
        progress: {$ref: '#/components/schemas/GarminProgress'}
        last_run_started_at: {type: [string, 'null'], format: date-time}
        last_run_finished_at: {type: [string, 'null'], format: date-time}
        last_success_at: {type: [string, 'null'], format: date-time}
        last_error:
          oneOf:
            - type: 'null'
            - type: object
              required: [code, message]
              properties:
                code: {type: string, description: 'garmin_key_invalid, garmin_rate_limited, garmin_unreachable, garmin_http_error, garmin_bad_response, internal_error'}
                message: {type: string, description: 'Deutsche Meldung für die Anzeige'}
        counts:
          type: object
          required: [imported, linked, locked, rejected, failed]
          properties:
            imported: {type: integer}
            linked: {type: integer}
            locked: {type: integer}
            rejected: {type: integer}
            failed: {type: integer}
    GarminStatusResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/GarminStatus'}
    GarminSettingsUpdate:
      type: object
      additionalProperties: false
      properties:
        api_key: {type: [string, 'null'], minLength: 8, maxLength: 4096, writeOnly: true, description: 'Persönlicher API-Schlüssel aus Garmin Connect; null entfernt ihn'}
        enabled: {type: boolean}
        start_date: {type: [string, 'null'], format: date}
        interval_minutes: {type: integer, minimum: 5, maximum: 1440}
    GarminActivity:
      type: object
      required: [garmin_id, start_time, type_key, status, activity_id, activity_title, reason_code, reason, attempts, updated_at]
      properties:
        garmin_id: {type: string, description: 'Aktivitäts-ID in Garmin Connect'}
        start_time: {type: string, format: date-time}
        type_key: {type: [string, 'null'], description: 'Garmin-Typ; ersetzt beim Import den source_sport der Datei'}
        status: {$ref: '#/components/schemas/GarminActivityStatus'}
        activity_id: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}], description: 'null, wenn nichts übernommen wurde oder die Aktivität gelöscht ist'}
        activity_title: {type: [string, 'null']}
        reason_code: {type: [string, 'null']}
        reason: {type: [string, 'null']}
        attempts: {type: integer, minimum: 1}
        updated_at: {type: string, format: date-time}
    GarminActivityListResponse:
      type: object
      required: [data, meta]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/GarminActivity'}}
        meta: {$ref: '#/components/schemas/ListMeta'}
    SportMapping:
      type: object
      required: [source_sport, mapped, sport_class, sub_sport, effective_sport_class, effective_sub_sport, activity_count]
      properties:
        source_sport: {type: string}
        mapped: {type: boolean, description: 'Eigener Eintrag vorhanden'}
        sport_class: {oneOf: [{$ref: '#/components/schemas/SportClass'}, {type: 'null'}]}
        sub_sport: {type: [string, 'null']}
        effective_sport_class: {$ref: '#/components/schemas/SportClass'}
        effective_sub_sport: {type: [string, 'null']}
        activity_count: {type: integer, minimum: 0}
    SportMappingInput:
      type: object
      additionalProperties: false
      required: [sport_class]
      properties:
        sport_class: {$ref: '#/components/schemas/SportClass'}
        sub_sport: {type: [string, 'null'], description: 'Schlüssel im Katalog der Sportklasse'}
    SportMappingResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/SportMapping'}
    SportMappingListResponse:
      type: object
      required: [data, meta]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/SportMapping'}}
        meta: {type: object, required: [total], properties: {total: {type: integer}}}
    SubSportCatalogEntry:
      type: object
