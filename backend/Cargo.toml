[package]
name = "trackcraft"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart"] }
axum-server = { version = "0.9.0", default-features = false, features = ["tls-rustls-no-provider"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
fs4 = "1.1.0"
geo = "0.33.1"
http-body = "1.1.0"
http-body-util = "0.1.5"
quick-xml = "0.42.0"
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "ring", "x509-parser"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
rustyfit = "0.11.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate"] }
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
toml_edit = "0.25.19"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "set-header", "limit", "trace"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.29.1", features = ["v7"] }
webpki-roots = "1.0.12"
x509-parser = "0.18.1"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_System_EventLog", "Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
embedded-io-adapters = { version = "0.7", features = ["std"] }
jsonschema = { version = "0.63.1", default-features = false }
serde_yaml_ng = "0.10.0"
tempfile = { version = "3.27.0", default-features = false }
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
