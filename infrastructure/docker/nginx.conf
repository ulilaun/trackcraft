# Nginx im Frontend-Container (RFC-0005, RFC-0011). TLS macht der vorgeschaltete Reverse Proxy.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Uploads bis 50 MB und 1 h (RFC-0008) plus Spielraum für die Multipart-Rahmen; die genauen Grenzen prüft das Backend.
    client_max_body_size 51m;

    # Security-Header aus RFC-0011, auch auf Fehlerantworten. Keine CORS-Header.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location /api/ {
        # Host, Origin und Sec-Fetch-* unverändert weiterreichen, das Backend prüft sie.
        proxy_pass http://trackcraft-backend:8080;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
